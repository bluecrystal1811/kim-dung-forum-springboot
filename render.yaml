services:
  - type: web
    name: kimdungforum
    env: java
    branch: main
    plan: free
    # Ensure mvnw is executable on Render's Linux builders, then run it
    buildCommand: chmod +x ./mvnw && bash ./mvnw -DskipTests package
    startCommand: java -Dserver.port=$PORT -jar target/*.jar
    envVars:
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "true"
      - key: SPRING_JPA_FORMAT_SQL
        value: "true"
