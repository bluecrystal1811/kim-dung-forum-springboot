spring.application.name=KimDungForum

# Server port: Render provides $PORT at runtime. Default to 8080 for local dev.
server.port=${PORT:8080}

# ===================== Datasource (use environment variables) =====================
# For local development these default values will be used if env vars are not set.
# If you use Render Postgres, set SPRING_DATASOURCE_URL to a JDBC URL like:
# jdbc:postgresql://<HOST>:5432/<DBNAME>
# Render also provides a `DATABASE_URL` (postgres://user:pass@host:5432/dbname) —
# it's easiest to copy that into SPRING_DATASOURCE_URL in the Render dashboard.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kimdung_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:khoi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:181120}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
# Flyway migrations (enable by default when dependency is present)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
# Let Hibernate auto-select dialect when possible; override with env if needed
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# ===================== CORS (handled in code) =====================
# Vue dev server runs on http://localhost:5173
