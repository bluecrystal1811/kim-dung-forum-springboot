spring.application.name=KimDungForum

# Server port: Render provides $PORT at runtime. Default to 8080 for local dev.
server.port=${PORT:8080}

# ===================== Datasource (use environment variables) =====================
# For local development these default values will be used if env vars are not set.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=kimdung_db;encrypt=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:khoi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:181120}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
# Let Hibernate auto-select dialect when possible; override with env if needed
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.SQLServerDialect}

# ===================== CORS (handled in code) =====================
# Vue dev server runs on http://localhost:5173
